services:
  db:
    image: postgres:16-alpine
    container_name: menuchef-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: menuchef
      POSTGRES_PASSWORD: menuchef
      POSTGRES_DB: menuchef
    ports:
      - "5432:5432"
    volumes:
      - menuchef_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menuchef -d menuchef"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  menuchef_pgdata:
